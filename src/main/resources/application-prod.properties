# Production profile (SPRING_PROFILES_ACTIVE=prod). Secrets via env only.
spring.jpa.hibernate.ddl-auto=validate
spring.thymeleaf.cache=true
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never
logging.level.root=INFO
logging.level.org=WARN
pricing.api.log-level=${PRICING_LOG_LEVEL:NONE}
app.base-url=${APP_BASE_URL:https://testkauf.getinweb.de}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
management.endpoint.health.show-details=never
