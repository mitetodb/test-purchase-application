spring.application.name=Test Purchase Application
# All secrets come from environment variables. See .env.example. Nothing secret is committed here.
spring.mvc.hiddenmethod.filter.enabled=true
spring.mvc.throw-exception-if-no-handler-found=true

# --- database ---
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/test_purchase_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:testpurchase}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
logging.level.org.hibernate.persister.entity=ERROR
logging.level.org=WARN

# --- flyway (V1 = baseline of the pre-Flyway schema) ---
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- thymeleaf ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# --- i18n ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- uploads ---
app.upload.dir=${UPLOAD_DIR:uploads}
# Attachment uploads (content detected via magic bytes): jpeg, png, pdf, docx, xlsx
app.upload.attachment.allowed-types=${UPLOAD_ATTACHMENT_ALLOWED_TYPES:jpeg,png,pdf,docx,xlsx}
# Profile avatars: images only
app.upload.avatar.allowed-types=${UPLOAD_AVATAR_ALLOWED_TYPES:jpeg,png}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- pricing microservice ---
pricing.api.base-url=${PRICING_API_BASE_URL:http://localhost:8081}
pricing.api.key=${PRICING_API_KEY:}
pricing.api.log-level=${PRICING_LOG_LEVEL:BASIC}

# --- mail (optional) ---
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:testkauf@getinweb.de}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
management.health.mail.enabled=false

# --- app ---
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.init-data.enabled=${INIT_DATA_ENABLED:true}
app.init-data.admin-password=${ADMIN_PASSWORD:}
app.init-data.admin-email=${ADMIN_EMAIL:admin@example.com}
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

# --- public contact form ---
app.contact.recipient=${CONTACT_RECIPIENT:mail@getinweb.de}
app.contact.rate-limit.max-attempts=10
app.contact.rate-limit.window-seconds=3600
app.contact.min-submit-delay-ms=3000

# --- login security ---
app.security.login.max-failed-attempts=5
app.security.login.lockout-duration-minutes=15
app.security.login.rate-limit.max-attempts=20
app.security.login.rate-limit.window-seconds=60

# --- password policy ---
app.security.password.min-length=12

# --- TOTP 2FA (AES-256 key: openssl rand -base64 32) ---
app.security.totp.encryption-key=${APP_TOTP_ENCRYPTION_KEY:}
app.security.totp.issuer=${APP_TOTP_ISSUER:Test Purchase}

# --- TOTP session brute-force (pending 2FA step) ---
app.security.two-factor.max-session-failed-attempts=5

# --- actuator / openapi ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Number of demo test purchases to seed when app.demo-data.enabled=true (0 = no purchase seed). Idempotent.
app.demo-data.purchases=${DEMO_PURCHASES:0}
app.demo-data.users=${DEMO_USERS:false}

# --- list pagination (issue #15) ---
app.list-pagination.default-page-size=20
app.list-pagination.max-page-size=100

# --- list export (issue #15) ---
app.list-export.max-rows=10000

# --- test purchase deadline reminders (issue #16). Off by default: set DEADLINE_REMINDER_ENABLED=true on the server to send. ---
app.deadline-reminder.enabled=${DEADLINE_REMINDER_ENABLED:false}
app.deadline-reminder.days-before=${DEADLINE_REMINDER_DAYS_BEFORE:7,1,0}
app.deadline-reminder.cron=${DEADLINE_REMINDER_CRON:0 0 8 * * ?}

# --- monitoring signals for health.getinweb.de (issue #18). Alerts off by default. ---
app.monitoring.backup-check-enabled=${MONITORING_BACKUP_CHECK_ENABLED:false}
app.monitoring.backup-marker-path=${MONITORING_BACKUP_MARKER_PATH:}
app.monitoring.backup-scan-directory=${MONITORING_BACKUP_SCAN_DIRECTORY:}
app.monitoring.backup-max-age-hours=${MONITORING_BACKUP_MAX_AGE_HOURS:26}
app.monitoring.server-errors.window-seconds=${MONITORING_SERVER_ERROR_WINDOW_SECONDS:300}
app.monitoring.server-errors.threshold=${MONITORING_SERVER_ERROR_THRESHOLD:20}
app.monitoring.alert.enabled=${MONITORING_ALERT_ENABLED:false}
app.monitoring.alert.webhook-url=${MONITORING_ALERT_WEBHOOK_URL:}
app.monitoring.alert.email-to=${MONITORING_ALERT_EMAIL_TO:}
app.monitoring.alert.cron=${MONITORING_ALERT_CRON:0 */5 * * * ?}
management.health.defaults.enabled=true
