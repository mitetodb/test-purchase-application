<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{invoice.statement.title}">Monthly statement</title>
</head>
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 th:text="#{invoice.statement.title}">Monthly statement</h2>
        <a class="btn btn-outline-secondary" th:href="@{/invoices}" th:text="#{ui.back.0557}">Back</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form class="card card-body mb-3" method="get" th:action="@{/invoices/statement}">
        <div class="row g-2 align-items-end">
            <div class="col-md-4" sec:authorize="!hasRole('CUSTOMER')">
                <label class="form-label small mb-0" for="stmt-customer" th:text="#{ui.customer.5eea}">Customer</label>
                <select id="stmt-customer" name="customerId" class="form-select form-select-sm" required>
                    <option value="" disabled th:selected="${selectedCustomerId == null}" th:text="#{invoice.statement.selectCustomer}">Select customer</option>
                    <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${selectedCustomerId != null and selectedCustomerId.equals(c.id)}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-0" for="stmt-year" th:text="#{invoice.field.year}">Year</label>
                <input type="number" id="stmt-year" name="year" class="form-control form-control-sm"
                       th:value="${selectedYear}" min="2000" max="2100" required/>
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-0" for="stmt-month" th:text="#{invoice.field.month}">Month</label>
                <input type="number" id="stmt-month" name="month" class="form-control form-control-sm"
                       th:value="${selectedMonth}" min="1" max="12" required/>
            </div>
            <div class="col-md-auto">
                <button type="submit" class="btn btn-sm btn-primary" th:text="#{list.filter.apply}">Apply</button>
            </div>
        </div>
    </form>

    <div th:if="${statement != null}" class="card card-body">
        <h5 th:text="${statement.customerName}">Customer</h5>
        <p>
            <span th:text="#{invoice.field.period}">Period</span>:
            <span th:text="${statement.periodYear + '-' + #numbers.formatInteger(statement.periodMonth, 2)}"></span>
        </p>

        <table class="table table-sm">
            <thead>
            <tr>
                <th th:text="#{ui.number.2a39}">Number</th>
                <th th:text="#{ui.service_fee.eb23}">Service fee</th>
                <th th:text="#{ui.postage_fee.518c}">Postage</th>
                <th th:text="#{ui.total_price.614d}">Product</th>
                <th th:text="#{invoice.column.lineTotal}">Line total</th>
                <th th:text="#{invoice.statement.invoiced}">Invoiced</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${statement.purchases}">
                <td th:text="${row.testPurchaseNumber}"></td>
                <td th:text="${#numbers.formatDecimal(row.serviceFee, 1, 2)}"></td>
                <td th:text="${#numbers.formatDecimal(row.postageFee, 1, 2)}"></td>
                <td th:text="${#numbers.formatDecimal(row.productPrice, 1, 2)}"></td>
                <td th:text="${#numbers.formatDecimal(row.lineTotal, 1, 2)}"></td>
                <td>
                    <span th:if="${row.alreadyInvoiced}" class="badge bg-secondary" th:text="#{ui.yes}">Yes</span>
                    <span th:unless="${row.alreadyInvoiced}" class="badge bg-light text-dark" th:text="#{ui.no}">No</span>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="row">
            <div class="col-md-4"><strong th:text="#{invoice.statement.purchasesTotal}">Purchases total:</strong>
                <span th:text="${#numbers.formatDecimal(statement.purchasesTotal, 1, 2) + ' ' + statement.currency}"></span></div>
            <div class="col-md-4"><strong th:text="#{invoice.statement.baseFee}">Base fee:</strong>
                <span th:text="${#numbers.formatDecimal(statement.baseFeeAmount, 1, 2) + ' ' + statement.currency}"></span></div>
            <div class="col-md-4"><strong th:text="#{invoice.field.total}">Total:</strong>
                <span th:text="${#numbers.formatDecimal(statement.grandTotal, 1, 2) + ' ' + statement.currency}"></span></div>
        </div>

        <div sec:authorize="hasAnyRole('ADMIN','ACCOUNT_MANAGER')" class="mt-3">
            <div th:if="${statement.hasExistingInvoice}" class="alert alert-warning" th:text="#{invoice.statement.existingInvoice}">An invoice already exists for this period.</div>
            <form th:unless="${statement.hasExistingInvoice}" th:action="@{/invoices/create-from-statement}" method="post" class="mt-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="customerId" th:value="${statement.customerId}"/>
                <input type="hidden" name="year" th:value="${statement.periodYear}"/>
                <input type="hidden" name="month" th:value="${statement.periodMonth}"/>
                <button type="submit" class="btn btn-primary" th:text="#{invoice.action.createDraft}">Create draft invoice</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
