<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{invoice.view.title}">Invoice</title>
</head>
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 th:text="#{invoice.view.title}">Invoice</h2>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/invoices}" th:text="#{ui.back.0557}">Back</a>
            <a class="btn btn-primary" th:href="@{/invoices/{id}/pdf(id=${invoice.id})}"
               th:text="#{invoice.action.downloadPdf}">Download PDF</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="#{${successMessage}}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card card-body mb-3">
        <div class="mb-2"><strong th:text="#{ui.number.2a39}">Number:</strong> <span th:text="${invoice.number}"></span></div>
        <div class="mb-2"><strong th:text="#{ui.customer.5eea}">Customer:</strong> <span th:text="${invoice.customer.name}"></span></div>
        <div class="mb-2"><strong th:text="#{invoice.field.period}">Period:</strong>
            <span th:text="${invoice.periodYear + '-' + #numbers.formatInteger(invoice.periodMonth, 2)}"></span></div>
        <div class="mb-2"><strong th:text="#{ui.status.24a2}">Status:</strong> <span th:text="${invoice.status.displayName}"></span></div>
        <div class="mb-2"><strong th:text="#{invoice.field.total}">Total:</strong>
            <span th:text="${#numbers.formatDecimal(invoice.totalAmount, 1, 2) + ' ' + invoice.currency}"></span></div>
        <p class="text-muted small mb-0" th:text="#{invoice.bookkeepingNotice}">Bookkeeping record only — payment status is updated manually.</p>
    </div>

    <h5 th:text="#{invoice.pdf.lines}">Line items</h5>
    <table class="table">
        <thead>
        <tr>
            <th th:text="#{invoice.column.description}">Description</th>
            <th th:text="#{ui.qty.03ab}">Qty</th>
            <th th:text="#{invoice.column.unitAmount}">Unit amount</th>
            <th th:text="#{invoice.column.lineTotal}">Line total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="line : ${invoice.lineItems}">
            <td th:text="${line.description}"></td>
            <td th:text="${line.quantity}"></td>
            <td th:text="${#numbers.formatDecimal(line.unitAmount, 1, 2)}"></td>
            <td th:text="${#numbers.formatDecimal(line.lineTotal, 1, 2)}"></td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex flex-wrap gap-2" th:if="${canManage}">
        <form th:if="${invoice.status.name() == 'DRAFT'}" th:action="@{/invoices/{id}/issue(id=${invoice.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-success" th:text="#{invoice.action.issue}">Issue</button>
        </form>
        <form th:if="${invoice.status.name() == 'ISSUED'}" th:action="@{/invoices/{id}/mark-paid(id=${invoice.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-success" th:text="#{invoice.action.markPaid}">Mark paid</button>
        </form>
        <form th:if="${invoice.status.name() == 'DRAFT' or invoice.status.name() == 'ISSUED'}"
              th:action="@{/invoices/{id}/cancel(id=${invoice.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-danger" th:text="#{invoice.action.cancel}">Cancel</button>
        </form>
    </div>
</main>
</body>
</html>
