<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Server-side list pagination. Caller passes the Page and the list path.
  Query params stay aligned with the existing list filters (users, customers,
  test purchases, invoices). Sort is applied by the controller default when absent.
-->
<nav th:fragment="serverPagination(page, listPath)"
     class="list-pagination"
     th:if="${page != null and page.totalElements > 0}"
     th:attr="aria-label=#{list.pagination.nav}">
    <p class="list-pagination-summary"
       th:text="#{list.pagination.summary(${page.number + 1}, ${page.totalPages}, ${page.totalElements})}">
        Page 1 of 1 (0 items)
    </p>
    <div class="list-pagination-controls" th:if="${page.totalPages > 1}">
        <a class="list-page-link"
           th:unless="${page.first}"
           th:href="@{${listPath}(page=${page.number - 1}, size=${page.size}, status=${filter.status}, customerId=${filter.customerId}, createdFrom=${filter.createdFrom}, createdTo=${filter.createdTo}, mysteryShopperId=${filter.mysteryShopperId}, name=${filter.name}, category=${filter.category}, country=${filter.country}, showDeactivated=${filter.showDeactivated}, role=${filter.role}, active=${filter.active}, username=${filter.username})}"
           th:text="#{list.pagination.previous}">Previous</a>
        <span class="list-page-link is-disabled"
              th:if="${page.first}"
              aria-disabled="true"
              th:text="#{list.pagination.previous}">Previous</span>
        <span class="list-page-indicator"
              aria-current="page"
              th:text="#{list.pagination.pageIndicator(${page.number + 1}, ${page.totalPages})}">1 / 1</span>
        <a class="list-page-link"
           th:unless="${page.last}"
           th:href="@{${listPath}(page=${page.number + 1}, size=${page.size}, status=${filter.status}, customerId=${filter.customerId}, createdFrom=${filter.createdFrom}, createdTo=${filter.createdTo}, mysteryShopperId=${filter.mysteryShopperId}, name=${filter.name}, category=${filter.category}, country=${filter.country}, showDeactivated=${filter.showDeactivated}, role=${filter.role}, active=${filter.active}, username=${filter.username})}"
           th:text="#{list.pagination.next}">Next</a>
        <span class="list-page-link is-disabled"
              th:if="${page.last}"
              aria-disabled="true"
              th:text="#{list.pagination.next}">Next</span>
    </div>
</nav>
</body>
</html>
