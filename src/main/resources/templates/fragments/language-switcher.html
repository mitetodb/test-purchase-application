<!-- Accessible language switcher (BG / EN / DE). Included from the main navbar on every layout page. -->
<li th:fragment="app-language-switcher" class="nav-item dropdown" id="app-language-switcher">
    <a class="nav-link dropdown-toggle"
       href="#"
       id="app-lang-switcher-toggle"
       role="button"
       data-bs-toggle="dropdown"
       aria-expanded="false"
       aria-haspopup="true"
       aria-controls="app-lang-switcher-menu"
       th:attr="aria-label=#{lang.label}">
        <i class="fas fa-globe me-1" aria-hidden="true"></i>
        <span th:text="${#locale.language.toUpperCase()}">EN</span>
    </a>
    <ul class="dropdown-menu dropdown-menu-end"
        id="app-lang-switcher-menu"
        role="menu"
        th:attr="aria-label=#{lang.menu}">
        <li role="none">
            <a class="dropdown-item"
               role="menuitem"
               th:href="@{''(lang='bg')}"
               th:text="#{lang.bg}">Български</a>
        </li>
        <li role="none">
            <a class="dropdown-item"
               role="menuitem"
               th:href="@{''(lang='en')}"
               th:text="#{ui.english.7846}">English</a>
        </li>
        <li role="none">
            <a class="dropdown-item"
               role="menuitem"
               th:href="@{''(lang='de')}"
               th:text="#{ui.deutsch.8f0c}">Deutsch</a>
        </li>
    </ul>
</li>
