<!-- Accessible language switcher (BG / EN / DE). Public-style pill links. -->
<li th:fragment="app-language-switcher" class="nav-item">
    <nav class="app-langs" th:attr="aria-label=#{lang.label}">
        <a th:href="@{''(lang='de')}"
           lang="de"
           hreflang="de"
           title="Deutsch"
           th:attr="aria-current=${#locale.language=='de'}?'true'">DE</a>
        <a th:href="@{''(lang='en')}"
           lang="en"
           hreflang="en"
           title="English"
           th:attr="aria-current=${#locale.language=='en'}?'true'">EN</a>
        <a th:href="@{''(lang='bg')}"
           lang="bg"
           hreflang="bg"
           title="Български"
           th:attr="aria-current=${#locale.language=='bg'}?'true'">BG</a>
    </nav>
</li>
