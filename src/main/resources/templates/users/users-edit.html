<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{ui.edit_user.65d7}">Edit User</title>
</head>

<body>
<main>

    <h2 th:text="#{ui.edit_user.65d7}">Edit User</h2>

    <form th:action="@{|/users/edit/${userEditDTO.id}|}"
      th:object="${userEditDTO}"
      method="post">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="mb-3">
        <label th:text="#{ui.username_cannot_change.b730}">Username (cannot change)</label>
        <input class="form-control" th:field="*{username}" readonly>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.email.ce8a}">Email</label>
        <input class="form-control" type="email" th:field="*{email}">
    </div>

    <div class="mb-3">
        <label th:text="#{ui.country.5971}">Country</label>
        <select class="form-control" th:field="*{country}">
            <option th:each="c : ${T(app.model.enums.Country).values()}"
                    th:value="${c}"
                    th:text="${c.displayName}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.role.bbba}">Role</label>
        <select class="form-control" th:field="*{role}">
            <option th:each="r : ${T(app.model.enums.Role).values()}"
                    th:value="${r}"
                    th:text="${r.getDisplayName()}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label>
            <input type="checkbox" th:field="*{active}"> <th:block th:text="#{ui.active.4d3d}">Active</th:block>
        </label>
    </div>

    <div class="form-group"
          th:if="${userEditDTO.role == T(app.model.enums.Role).ACCOUNT_MANAGER}">
        <label for="managedCustomers" th:text="#{ui.managed_customers.7918}">Managed Customers</label>
        <select id="managedCustomers"
                class="form-control"
                multiple="multiple"
                th:field="*{managedCustomerIds}">
            <option th:each="c : ${allCustomers}"
                    th:value="${c.id}"
                    th:text="${c.name}">
            </option>
        </select>
        <small class="form-text text-muted" th:text="#{ui.hold_ctrl_cmd_on_mac_to_select_multiple.447e}">
            Hold Ctrl (Cmd on Mac) to select multiple customers.
        </small>
    </div>

    <button type="submit" class="btn btn-primary" th:text="#{ui.save.c9cc}">Save</button>
</form>

</main>
</body>
</html>
