<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="#{ui.users.f9aa}">Users</title>
</head>

<body>
<main class="list-page">

    <header class="list-page-header">
        <h1 id="users-heading" th:text="#{ui.users.f9aa}">Users</h1>
        <a th:href="@{/users/add}" class="btn btn-tk-primary" th:text="#{ui.add_user.c220}">Add User</a>
    </header>

    <form class="list-filters" method="get" th:action="@{/users}">
        <input type="hidden" name="size" th:value="${userPage.size}"/>
        <div class="list-filter-grid">
            <div class="list-field">
                <label for="filter-username" th:text="#{ui.username.f603}">Username</label>
                <input type="text" id="filter-username" name="username" class="list-input"
                       th:value="${filter.username}" th:placeholder="#{ui.search_username.3ca7}"/>
            </div>
            <div class="list-field">
                <label for="filter-role" th:text="#{ui.role.bbba}">Role</label>
                <select id="filter-role" name="role" class="list-select">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option th:each="r : ${roles}" th:value="${r.name}" th:text="${r.displayName}"
                            th:selected="${filter.role == r}"></option>
                </select>
            </div>
            <div class="list-field">
                <label for="filter-active" th:text="#{ui.active.4d3d}">Active</label>
                <select id="filter-active" name="active" class="list-select">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option value="true" th:text="#{ui.yes}" th:selected="${filter.active != null and filter.active}">Yes</option>
                    <option value="false" th:text="#{ui.no}" th:selected="${filter.active != null and !filter.active}">No</option>
                </select>
            </div>
            <div class="list-field">
                <label for="filter-country" th:text="#{ui.country.5971}">Country</label>
                <select id="filter-country" name="country" class="list-select">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option th:each="co : ${countries}" th:value="${co.name}" th:text="${co.displayName}"
                            th:selected="${filter.country == co}"></option>
                </select>
            </div>
        </div>
        <div class="list-filter-actions">
            <button type="submit" class="btn btn-sm btn-tk-primary" th:text="#{list.filter.apply}">Apply</button>
            <a th:href="@{/users}" class="btn btn-sm btn-tk-outline" th:text="#{list.filter.reset}">Reset</a>
        </div>
    </form>

    <div th:if="${exportLimitExceeded}" class="list-alert" role="alert"
         th:text="${exportLimitMessage}"></div>

    <div class="list-toolbar">
        <th:block th:replace="~{fragments/server-list-pagination :: serverPagination(${userPage}, '/users')}"></th:block>
        <div class="list-exports">
            <a class="btn btn-sm btn-tk-outline"
               th:href="@{/users/export.csv(username=${filter.username}, role=${filter.role}, active=${filter.active}, country=${filter.country}, sort=${listSort})}"
               th:text="#{list.export.csv}">Export CSV</a>
            <a class="btn btn-sm btn-tk-outline"
               th:href="@{/users/export.xlsx(username=${filter.username}, role=${filter.role}, active=${filter.active}, country=${filter.country}, sort=${listSort})}"
               th:text="#{list.export.excel}">Export Excel</a>
        </div>
    </div>

    <div class="list-table-card">
        <div class="list-table-scroll">
            <table id="usersTable" class="list-table" aria-labelledby="users-heading">
                <thead>
                <tr>
                    <th scope="col" th:text="#{list.col.number}">#</th>
                    <th scope="col" th:text="#{ui.username.f603}">Username</th>
                    <th scope="col" th:text="#{ui.email.ce8a}">Email</th>
                    <th scope="col" th:text="#{ui.country.5971}">Country</th>
                    <th scope="col" th:text="#{ui.role.bbba}">Role</th>
                    <th scope="col" th:text="#{ui.active.4d3d}">Active</th>
                    <th scope="col" th:text="#{login.lockout.status}">Lockout</th>
                    <th scope="col" th:text="#{ui.created_on.1b60}">Created On</th>
                    <th scope="col" sec:authorize="hasRole('ADMIN')" th:text="#{ui.updated_by.eb4d}">Updated By</th>
                    <th scope="col" th:text="#{ui.actions.06df}">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="u : ${users}">
                    <td><span class="list-id-clip" th:text="${u.id}" th:title="${u.id}"></span></td>
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.country.getDisplayName()}"></td>
                    <td><span class="tk-chip" th:text="${u.role.getDisplayName()}"></span></td>
                    <td>
                        <span th:if="${u.active}" class="tk-chip tk-chip-on" th:text="#{ui.yes}">Yes</span>
                        <span th:unless="${u.active}" class="tk-chip tk-chip-off" th:text="#{ui.no}">No</span>
                    </td>
                    <td>
                        <span th:if="${u.lockedUntil != null and u.lockedUntil.isAfter(T(java.time.LocalDateTime).now())}"
                              class="tk-chip tk-chip-locked"
                              th:text="#{login.lockout.locked}">Locked</span>
                        <span th:if="${u.lockedUntil == null or !u.lockedUntil.isAfter(T(java.time.LocalDateTime).now())}"
                              class="list-muted"
                              th:text="#{login.lockout.notLocked}">—</span>
                    </td>
                    <td th:text="${#temporals.format(u.createdOn, 'yyyy-MM-dd HH:mm')}"></td>
                    <td sec:authorize="hasRole('ADMIN')" th:text="${u.updatedByUser}"></td>

                    <td class="list-actions-cell">
                        <div class="list-actions">
                            <a th:href="@{'/users/edit/' + ${u.id}}"
                               class="btn btn-sm btn-tk-clay" th:text="#{ui.edit.7dce}">Edit</a>

                            <form th:action="@{'/users/deactivate/' + ${u.id}}"
                                  method="post"
                                  class="list-inline-form"
                                  th:if="${#authorization.expression('hasRole(''ADMIN'')') and u.active}">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>

                                <button class="btn btn-sm btn-tk-danger"
                                        type="submit" th:text="#{ui.deactivate_user.a1b2}">Deactivate</button>
                            </form>

                            <form th:action="@{'/users/reactivate/' + ${u.id}}"
                                  method="post"
                                  class="list-inline-form"
                                  th:if="${#authorization.expression('hasRole(''ADMIN'')') and !u.active}">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>

                                <button class="btn btn-sm btn-tk-mint"
                                        type="submit" th:text="#{ui.reactivate_user.c3d4}">Reactivate</button>
                            </form>

                            <form th:action="@{'/users/unlock/' + ${u.id}}"
                                  method="post"
                                  class="list-inline-form"
                                  th:if="${#authorization.expression('hasRole(''ADMIN'')') and u.lockedUntil != null and u.lockedUntil.isAfter(T(java.time.LocalDateTime).now())}">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>

                                <button class="btn btn-sm btn-tk-mint"
                                        type="submit" th:text="#{login.lockout.unlock}">Unlock</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}" class="list-empty-row">
                    <td colspan="10">
                        <div class="list-empty">
                            <p th:text="#{list.empty}">No records found.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="list-toolbar list-toolbar-bottom">
        <th:block th:replace="~{fragments/server-list-pagination :: serverPagination(${userPage}, '/users')}"></th:block>
    </div>

</main>
</body>
</html>
