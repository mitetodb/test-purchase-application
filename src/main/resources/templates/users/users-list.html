<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="#{ui.users.f9aa}">Users</title>
</head>

<body>
<main>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="#{ui.users.f9aa}">Users</h2>
        <a th:href="@{/users/add}" class="btn btn-primary" th:text="#{ui.add_user.c220}">Add User</a>
    </div>
    <div id="export-buttons-users" class="mb-3"></div>

    <table id="usersTable" class="table table-hover">
        <thead>
        <tr>
            <th class="sortable">#</th>
            <th class="sortable" th:text="#{ui.username.f603}">Username</th>
            <th class="sortable" th:text="#{ui.email.ce8a}">Email</th>
            <th class="sortable" th:text="#{ui.country.5971}">Country</th>
            <th class="sortable" th:text="#{ui.role.bbba}">Role</th>
            <th class="sortable" th:text="#{ui.active.4d3d}">Active</th>
            <th class="sortable" th:text="#{ui.created_on.1b60}">Created On</th>
            <th sec:authorize="hasRole('ADMIN')" class="sortable" th:text="#{ui.updated_by.eb4d}">Updated By</th>

            <th th:text="#{ui.actions.06df}">Actions</th>
        </tr>
        <tr>
            <th><input class="form-control form-control-sm column-filter" placeholder="Search ID" th:placeholder="#{ui.search_id.14b6}"></th>
            <th><input class="form-control form-control-sm column-filter" placeholder="Search username" th:placeholder="#{ui.search_username.3ca7}"></th>
            <th><input class="form-control form-control-sm column-filter" placeholder="Search email" th:placeholder="#{ui.search_email.2459}"></th>
            <th><input class="form-control form-control-sm column-filter" placeholder="Search country" th:placeholder="#{ui.search_country.288d}"></th>
            <th><input class="form-control form-control-sm column-filter" placeholder="Search role" th:placeholder="#{ui.search_role.e262}"></th>
            <th><input class="form-control form-control-sm column-filter" placeholder="Search active" th:placeholder="#{ui.search_active.bbf9}"></th>
            <th><input class="form-control form-control-sm column-filter" placeholder="Search created" th:placeholder="#{ui.search_created.0337}"></th>
            <th sec:authorize="hasRole('ADMIN')"><input class="form-control form-control-sm column-filter" placeholder="Search updated" th:placeholder="#{ui.search_updated.c38c}"></th>
            <th></th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.country.getDisplayName()}"></td>
            <td th:text="${u.role.getDisplayName()}"></td>

            <td>
                <span th:text="${u.active ? 'Yes' : 'No'}"></span>
            </td>
            <td th:text="${#temporals.format(u.createdOn, 'yyyy-MM-dd HH:mm')}"></td>
            <td sec:authorize="hasRole('ADMIN')" th:text="${u.updatedByUser}"></td>

            <td>
                <a th:href="@{'/users/edit/' + ${u.id}}"
                   class="btn btn-sm btn-warning" th:text="#{ui.edit.7dce}">Edit</a>

                <form th:action="@{'/users/delete/' + ${u.id}}"
                      method="post"
                      th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                      style="display:inline;">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <button class="btn btn-sm btn-danger"
                            type="submit" th:text="#{ui.delete.f2a6}">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            initDataTable("usersTable");
            attachExportButtons("export-buttons-users", "usersTable");
        });
    </script>

</main>
</body>
</html>
