<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="#{ui.users.f9aa}">Users</title>
</head>

<body>
<main>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="#{ui.users.f9aa}">Users</h2>
        <a th:href="@{/users/add}" class="btn btn-primary" th:text="#{ui.add_user.c220}">Add User</a>
    </div>

    <form class="card card-body mb-3" method="get" th:action="@{/users}">
        <input type="hidden" name="size" th:value="${userPage.size}"/>
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small mb-0" for="filter-username" th:text="#{ui.username.f603}">Username</label>
                <input type="text" id="filter-username" name="username" class="form-control form-control-sm"
                       th:value="${filter.username}" th:placeholder="#{ui.search_username.3ca7}"/>
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-0" for="filter-role" th:text="#{ui.role.bbba}">Role</label>
                <select id="filter-role" name="role" class="form-select form-select-sm">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option th:each="r : ${roles}" th:value="${r.name}" th:text="${r.displayName}"
                            th:selected="${filter.role == r}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-0" for="filter-active" th:text="#{ui.active.4d3d}">Active</label>
                <select id="filter-active" name="active" class="form-select form-select-sm">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option value="true" th:text="#{ui.yes}" th:selected="${filter.active != null and filter.active}">Yes</option>
                    <option value="false" th:text="#{ui.no}" th:selected="${filter.active != null and !filter.active}">No</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-0" for="filter-country" th:text="#{ui.country.5971}">Country</label>
                <select id="filter-country" name="country" class="form-select form-select-sm">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option th:each="co : ${countries}" th:value="${co.name}" th:text="${co.displayName}"
                            th:selected="${filter.country == co}"></option>
                </select>
            </div>
            <div class="col-md-auto d-flex gap-2">
                <button type="submit" class="btn btn-sm btn-primary" th:text="#{list.filter.apply}">Apply</button>
                <a th:href="@{/users}" class="btn btn-sm btn-outline-secondary" th:text="#{list.filter.reset}">Reset</a>
            </div>
        </div>
    </form>

    <div th:if="${exportLimitExceeded}" class="alert alert-warning" role="alert"
         th:text="${exportLimitMessage}"></div>

    <div th:replace="~{fragments/server-list-pagination :: serverPagination(${userPage}, '/users')}"></div>

    <div class="mb-3 d-flex flex-wrap gap-2">
        <a class="btn btn-success btn-sm"
           th:href="@{/users/export.csv(username=${filter.username}, role=${filter.role}, active=${filter.active}, country=${filter.country})}"
           th:text="#{list.export.csv}">Export CSV</a>
        <a class="btn btn-secondary btn-sm"
           th:href="@{/users/export.xlsx(username=${filter.username}, role=${filter.role}, active=${filter.active}, country=${filter.country})}"
           th:text="#{list.export.excel}">Export Excel</a>
    </div>

    <table id="usersTable" class="table table-hover">
        <thead>
        <tr>
            <th>#</th>
            <th th:text="#{ui.username.f603}">Username</th>
            <th th:text="#{ui.email.ce8a}">Email</th>
            <th th:text="#{ui.country.5971}">Country</th>
            <th th:text="#{ui.role.bbba}">Role</th>
            <th th:text="#{ui.active.4d3d}">Active</th>
            <th th:text="#{login.lockout.status}">Lockout</th>
            <th th:text="#{ui.created_on.1b60}">Created On</th>
            <th sec:authorize="hasRole('ADMIN')" th:text="#{ui.updated_by.eb4d}">Updated By</th>

            <th th:text="#{ui.actions.06df}">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.country.getDisplayName()}"></td>
            <td th:text="${u.role.getDisplayName()}"></td>

            <td>
                <span th:text="${u.active ? 'Yes' : 'No'}"></span>
            </td>
            <td>
                <span th:if="${u.lockedUntil != null and u.lockedUntil.isAfter(T(java.time.LocalDateTime).now())}"
                      class="badge bg-danger"
                      th:text="#{login.lockout.locked}">Locked</span>
                <span th:if="${u.lockedUntil == null or !u.lockedUntil.isAfter(T(java.time.LocalDateTime).now())}"
                      class="text-muted"
                      th:text="#{login.lockout.notLocked}">—</span>
            </td>
            <td th:text="${#temporals.format(u.createdOn, 'yyyy-MM-dd HH:mm')}"></td>
            <td sec:authorize="hasRole('ADMIN')" th:text="${u.updatedByUser}"></td>

            <td>
                <a th:href="@{'/users/edit/' + ${u.id}}"
                   class="btn btn-sm btn-warning" th:text="#{ui.edit.7dce}">Edit</a>

                <form th:action="@{'/users/deactivate/' + ${u.id}}"
                      method="post"
                      th:if="${#authorization.expression('hasRole(''ADMIN'')') and u.active}"
                      style="display:inline;">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <button class="btn btn-sm btn-outline-danger"
                            type="submit" th:text="#{ui.deactivate_user.a1b2}">Deactivate</button>
                </form>

                <form th:action="@{'/users/reactivate/' + ${u.id}}"
                      method="post"
                      th:if="${#authorization.expression('hasRole(''ADMIN'')') and !u.active}"
                      style="display:inline;">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <button class="btn btn-sm btn-outline-success"
                            type="submit" th:text="#{ui.reactivate_user.c3d4}">Reactivate</button>
                </form>

                <form th:action="@{'/users/unlock/' + ${u.id}}"
                      method="post"
                      th:if="${#authorization.expression('hasRole(''ADMIN'')') and u.lockedUntil != null and u.lockedUntil.isAfter(T(java.time.LocalDateTime).now())}"
                      style="display:inline;">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <button class="btn btn-sm btn-outline-success"
                            type="submit" th:text="#{login.lockout.unlock}">Unlock</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="10" class="text-muted text-center" th:text="#{list.empty}">No records found.</td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/server-list-pagination :: serverPagination(${userPage}, '/users')}"></div>

</main>
</body>
</html>
