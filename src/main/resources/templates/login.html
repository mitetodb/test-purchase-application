<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{ui.login_test_purchase_system.6645}">Login - Test Purchase System</title>
</head>
<body>
<main>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="mb-3">
                    <i class="fas fa-shopping-bag" style="font-size: 3rem; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;"></i>
                </div>
                <h2 th:text="#{login.title}">Welcome Back</h2>
                <p class="text-muted" th:text="#{ui.sign_in_to_your_account.41c7}">Sign in to your account</p>
            </div>

            <!-- Error Message -->
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <th:block th:text="#{ui.invalid_username_or_password_please_try.0848}">Invalid username or password. Please try again.</th:block>
            </div>

            <!-- Logout Message -->
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <th:block th:text="#{ui.you_have_been_logged_out_successfully.ab54}">You have been logged out successfully.</th:block>
            </div>

            <!-- Registration Success Message -->
            <div th:if="${param.registered}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <th:block th:text="#{ui.registration_successful_please_login_wit.67df}">Registration successful! Please login with your credentials.</th:block>
            </div>

            <form th:action="@{/login}" method="post" class="login-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="fas fa-user me-2"></i><span th:text="#{login.username}">Username</span>
                    </label>
                    <input type="text"
                           class="form-control"
                           id="username"
                           name="username"
                           placeholder="Enter your username" th:placeholder="#{ui.enter_your_username.dd62}"
                           required
                           autofocus/>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock me-2"></i><span th:text="#{login.password}">Password</span>
                    </label>
                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Enter your password" th:placeholder="#{ui.enter_your_password.e8d2}"
                           required/>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">
                        <label class="form-check-label" for="rememberMe" th:text="#{ui.remember_me.8785}">
                            Remember me
                        </label>
                    </div>
                    <a th:href="@{/forgot-password}" class="text-decoration-none" style="color: var(--primary-color);">
                        <i class="fas fa-question-circle me-1"></i><span th:text="#{login.forgot}">Forgot Password?</span>
                    </a>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="fas fa-sign-in-alt me-2"></i><span th:text="#{login.submit}">Sign In</span>
                </button>

                <div class="text-center">
                    <p class="mb-0">
                        <th:block th:text="#{ui.don_t_have_an_account.a5f6}">Don't have an account?</th:block>
                        <a th:href="@{/register}" class="text-decoration-none fw-bold" style="color: var(--primary-color);">
                            <i class="fas fa-user-plus me-1"></i><span th:text="#{login.register}">Register here</span>
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
