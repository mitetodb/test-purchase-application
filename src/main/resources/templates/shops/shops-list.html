<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{ui.shops.12a5}">Shops</title>
</head>

<body>
<main>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="#{ui.shops.12a5}">Shops</h2>
        <a th:href="@{/shops/add}" class="btn btn-primary mb-3" th:text="#{ui.add_shop.8713}">Add Shop</a>
    </div>

    <form sec:authorize="hasRole('ADMIN')"
          method="get"
          th:action="@{/shops}"
          class="mb-3 d-flex align-items-center gap-2">
        <div class="form-check">
            <input class="form-check-input"
                   type="checkbox"
                   name="showDeactivated"
                   value="true"
                   id="showDeactivatedShops"
                   th:checked="${showDeactivated}"/>
            <label class="form-check-label" for="showDeactivatedShops"
                   th:text="#{ui.show_deactivated_shops.s1a2}">Show deactivated shops</label>
        </div>
        <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="#{ui.apply_filter.b9c0}">Apply</button>
    </form>

    <div id="export-buttons-shops" class="mb-3"></div>

    <table id="shopsTable" class="table table-striped">
        <thead>
        <tr>
            <th class="sortable">#</th>
            <th class="sortable" th:text="#{ui.name.49ee}">Name</th>
            <th class="sortable" th:text="#{ui.country.5971}">Country</th>
            <th sec:authorize="hasRole('ADMIN')" class="sortable" th:text="#{ui.active.4d3d}">Active</th>
            <th sec:authorize="hasRole('ADMIN')" class="sortable" th:text="#{ui.updated_by.eb4d}">Updated By</th>
            <th th:text="#{ui.actions.06df}">Actions</th>
        </tr>
        <tr>
            <th><input class="form-control form-control-sm column-filter" placeholder="Search #"></th>
            <th><input class="form-control form-control-sm column-filter" placeholder="Search Name" th:placeholder="#{ui.search_name.7c48}"></th>
            <th><input class="form-control form-control-sm column-filter" placeholder="Search Country" th:placeholder="#{ui.search_country.08b5}"></th>
            <th sec:authorize="hasRole('ADMIN')"><input class="form-control form-control-sm column-filter" placeholder="Search active" th:placeholder="#{ui.search_active.bbf9}"></th>
            <th sec:authorize="hasRole('ADMIN')"><input class="form-control form-control-sm column-filter" placeholder="Search Updated" th:placeholder="#{ui.search_updated.6899}"></th>
            <th></th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="s : ${shops}">
            <td th:text="${s.number}"></td>
            <td th:text="${s.name}"></td>
            <td th:text="${s.country.getDisplayName()}"></td>
            <td sec:authorize="hasRole('ADMIN')">
                <span th:text="${s.active ? 'Yes' : 'No'}"></span>
            </td>
            <td sec:authorize="hasRole('ADMIN')" th:text="${s.updatedByUser}"></td>
            <td>
                <a th:if="${s.active}"
                   th:href="@{'/shops/edit/' + ${s.id}}" class="btn btn-warning btn-sm" th:text="#{ui.edit.7dce}">Edit</a>

                <form th:if="${#authorization.expression('hasRole(''ADMIN'')') and s.active}"
                      th:action="@{'/shops/deactivate/' + ${s.id}}"
                      method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="btn btn-sm btn-outline-danger"
                            type="submit"
                            th:attr="data-confirm=#{ui.confirm_deactivate_shop.s3b4}"
                            onclick="return confirm(this.dataset.confirm);"
                            th:text="#{ui.deactivate_shop.s5c6}">Deactivate</button>
                </form>

                <form th:if="${#authorization.expression('hasRole(''ADMIN'')') and !s.active}"
                      th:action="@{'/shops/reactivate/' + ${s.id}}"
                      method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button class="btn btn-sm btn-outline-success"
                            type="submit" th:text="#{ui.reactivate_shop.s7d8}">Reactivate</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            initDataTable("shopsTable");
            attachExportButtons("export-buttons-shops", "shopsTable");
        });
    </script>

</main>
</body>
</html>
