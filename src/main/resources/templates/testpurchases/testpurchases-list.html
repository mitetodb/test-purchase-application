<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{ui.test_purchases.b6c5}">Test Purchases</title>
</head>
<body>
<main class="list-page">

    <header class="list-page-header">
        <div>
            <h1 id="tp-heading">
                <i class="fas fa-shopping-cart" aria-hidden="true"></i><span th:text="#{ui.test_purchases.b6c5}">Test Purchases</span>
            </h1>
            <p class="list-page-lead" th:text="#{ui.manage_and_track_all_test_purchase_order.4c0a}">Manage and track all test purchase orders</p>
        </div>
        <a th:href="@{/testpurchases/add}" class="btn btn-tk-primary">
            <i class="fas fa-plus" aria-hidden="true"></i><span th:text="#{ui.create_test_purchase.c4dd}">Create Test Purchase</span>
        </a>
    </header>

    <form class="list-filters" method="get" th:action="@{/testpurchases}">
        <input type="hidden" name="size" th:value="${purchasePage.size}"/>
        <div sec:authorize="hasRole('ADMIN')" class="list-check">
            <input type="checkbox"
                   name="showArchived"
                   value="true"
                   id="showArchivedPurchases"
                   th:checked="${showArchived}"/>
            <label for="showArchivedPurchases"
                   th:text="#{ui.show_archived_test_purchases.t1a2}">Show archived test purchases</label>
        </div>
        <div class="list-filter-grid">
            <div class="list-field">
                <label for="filter-status" th:text="#{ui.status.ec53}">Status</label>
                <select id="filter-status" name="status" class="list-select">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option th:each="s : ${statuses}" th:value="${s.name}" th:text="${s.displayName}"
                            th:selected="${filter.status == s}"></option>
                </select>
            </div>
            <div class="list-field" sec:authorize="hasAnyRole('ADMIN','ACCOUNT_MANAGER','SALES_MANAGER')">
                <label for="filter-customer" th:text="#{ui.customer.ce26}">Customer</label>
                <select id="filter-customer" name="customerId" class="list-select">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option th:each="c : ${filterCustomers}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${filter.customerId != null and filter.customerId == c.id}"></option>
                </select>
            </div>
            <div class="list-field">
                <label for="filter-from" th:text="#{list.filter.dateFrom}">From</label>
                <input type="date" id="filter-from" name="createdFrom" class="list-input"
                       th:value="${filter.createdFrom}"/>
            </div>
            <div class="list-field">
                <label for="filter-to" th:text="#{list.filter.dateTo}">To</label>
                <input type="date" id="filter-to" name="createdTo" class="list-input"
                       th:value="${filter.createdTo}"/>
            </div>
            <div class="list-field" th:if="${canFilterMysteryShopper}">
                <label for="filter-ms" th:text="#{list.filter.mysteryShopper}">Mystery Shopper</label>
                <select id="filter-ms" name="mysteryShopperId" class="list-select">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option th:each="ms : ${mysteryShoppers}" th:value="${ms.id}" th:text="${ms.username}"
                            th:selected="${filter.mysteryShopperId != null and filter.mysteryShopperId == ms.id}"></option>
                </select>
            </div>
        </div>
        <div class="list-filter-actions">
            <button type="submit" class="btn btn-sm btn-tk-primary" th:text="#{list.filter.apply}">Apply</button>
            <a th:href="@{/testpurchases}" class="btn btn-sm btn-tk-outline" th:text="#{list.filter.reset}">Reset</a>
        </div>
    </form>

    <div th:if="${exportLimitExceeded}" class="list-alert" role="alert"
         th:text="${exportLimitMessage}"></div>

    <div class="list-toolbar">
        <th:block th:replace="~{fragments/server-list-pagination :: serverPagination(${purchasePage}, '/testpurchases')}"></th:block>
        <div class="list-exports">
            <a class="btn btn-sm btn-tk-outline"
               th:href="@{/testpurchases/export.csv(status=${filter.status}, customerId=${filter.customerId}, createdFrom=${filter.createdFrom}, createdTo=${filter.createdTo}, mysteryShopperId=${filter.mysteryShopperId}, showArchived=${filter.showArchived}, sort=${listSort})}"
               th:text="#{list.export.csv}">Export CSV</a>
            <a class="btn btn-sm btn-tk-outline"
               th:href="@{/testpurchases/export.xlsx(status=${filter.status}, customerId=${filter.customerId}, createdFrom=${filter.createdFrom}, createdTo=${filter.createdTo}, mysteryShopperId=${filter.mysteryShopperId}, showArchived=${filter.showArchived}, sort=${listSort})}"
               th:text="#{list.export.excel}">Export Excel</a>
        </div>
    </div>

    <div class="list-table-card">
        <div class="list-table-scroll">
            <table id="tpTable" class="list-table" aria-labelledby="tp-heading">
                <thead>
                <tr>
                    <th scope="col" th:text="#{list.col.number}">#</th>
                    <th scope="col" th:text="#{ui.customer.ce26}">Customer</th>
                    <th scope="col" th:text="#{ui.shop.9f82}">Shop</th>
                    <th scope="col" th:text="#{ui.country.5971}">Country</th>
                    <th scope="col" th:text="#{ui.category.3adb}">Category</th>
                    <th scope="col" th:text="#{ui.type.a1fa}">Type</th>
                    <th scope="col" th:text="#{ui.total_price.f354}">Total Price</th>
                    <th scope="col" th:text="#{ui.status.ec53}">Status</th>
                    <th scope="col" th:text="#{ui.deadline.d16e}">Deadline</th>
                    <th scope="col" th:text="#{ui.created_on.1b60}">Created On</th>
                    <th scope="col" sec:authorize="hasRole('ADMIN')" th:text="#{ui.updated_by.eb4d}">Updated By</th>
                    <th scope="col" th:text="#{ui.actions.06df}">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="p : ${purchases}"
                    th:classappend="${p.overdue and (#authorization.expression('hasRole(''ACCOUNT_MANAGER'')') or #authorization.expression('hasRole(''ADMIN'')'))} ? 'list-row-attention' : ''">
                    <td th:text="${p.number}"></td>
                    <td th:text="${p.customer.name}"></td>
                    <td th:text="${p.shop.name}"></td>
                    <td th:text="${p.country.getDisplayName()}"></td>
                    <td th:text="${p.category.getDisplayName()}"></td>
                    <td th:text="${p.type.getDisplayName()}"></td>
                    <td th:text="${p.productPrice}"></td>
                    <td>
                        <span class="tk-chip"
                              th:classappend="${'tk-chip-' + #strings.toLowerCase(p.status.name())}"
                              th:text="${p.status.getDisplayName()}"></span>
                    </td>
                    <td>
                        <span th:if="${p.deadlineAt != null}" th:text="${#temporals.format(p.deadlineAt, 'yyyy-MM-dd')}"></span>
                        <span th:if="${p.overdue and (#authorization.expression('hasRole(''ACCOUNT_MANAGER'')') or #authorization.expression('hasRole(''ADMIN'')'))}"
                              class="tk-chip tk-chip-locked" th:text="#{ui.deadline_overdue.f18g}">Overdue</span>
                    </td>
                    <td th:text="${#temporals.format(p.createdDate, 'yyyy-MM-dd HH:mm')}"></td>
                    <td sec:authorize="hasRole('ADMIN')" th:text="${p.updatedByUser}"></td>
                    <td class="list-actions-cell">
                        <div class="list-actions">
                            <a th:href="@{'/testpurchases/view/' + ${p.id}}" class="btn btn-sm btn-tk-outline">
                                <i class="fas fa-eye" aria-hidden="true"></i><span th:text="#{ui.view.4351}">View</span>
                            </a>
                            <a th:if="${!p.archived}"
                               th:href="@{'/testpurchases/edit/' + ${p.id}}" class="btn btn-sm btn-tk-clay"
                               sec:authorize="hasAnyRole('ADMIN','ACCOUNT_MANAGER')">
                                <i class="fas fa-edit" aria-hidden="true"></i><span th:text="#{ui.edit.7dce}">Edit</span>
                            </a>

                            <form th:if="${#authorization.expression('hasRole(''ADMIN'')') and !p.archived}"
                                  th:action="@{'/testpurchases/archive/' + ${p.id}}" method="post" class="list-inline-form">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="btn btn-sm btn-tk-danger" type="submit"
                                        th:attr="data-confirm=#{ui.confirm_archive_test_purchase.t3b4}"
                                        onclick="return confirm(this.dataset.confirm);">
                                    <i class="fas fa-archive" aria-hidden="true"></i><span th:text="#{ui.archive_test_purchase.t5c6}">Archive</span>
                                </button>
                            </form>

                            <form th:if="${#authorization.expression('hasRole(''ADMIN'')') and p.archived}"
                                  th:action="@{'/testpurchases/unarchive/' + ${p.id}}" method="post" class="list-inline-form">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="btn btn-sm btn-tk-mint" type="submit" th:text="#{ui.unarchive_test_purchase.t7d8}">Unarchive</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(purchases)}" class="list-empty-row">
                    <td colspan="12">
                        <div class="list-empty">
                            <p th:text="#{list.empty}">No records found.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="list-toolbar list-toolbar-bottom">
        <th:block th:replace="~{fragments/server-list-pagination :: serverPagination(${purchasePage}, '/testpurchases')}"></th:block>
    </div>

</main>
</body>
</html>
