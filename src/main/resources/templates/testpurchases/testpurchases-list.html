<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{ui.test_purchases.b6c5}">Test Purchases</title>
</head>
<body>
<main>

    <div class="page-header">
        <div>
            <h2 class="text-gradient mb-1">
                <i class="fas fa-shopping-cart me-2"></i><th:block th:text="#{ui.test_purchases.b6c5}">Test Purchases</th:block>
            </h2>
            <p class="text-muted mb-0" th:text="#{ui.manage_and_track_all_test_purchase_order.4c0a}">Manage and track all test purchase orders</p>
        </div>
        <a th:href="@{/testpurchases/add}" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i><th:block th:text="#{ui.create_test_purchase.c4dd}">Create Test Purchase</th:block>
        </a>
    </div>

    <form class="card card-body mb-3" method="get" th:action="@{/testpurchases}">
        <input type="hidden" name="size" th:value="${purchasePage.size}"/>
        <div sec:authorize="hasRole('ADMIN')" class="mb-2">
            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       name="showArchived"
                       value="true"
                       id="showArchivedPurchases"
                       th:checked="${showArchived}"/>
                <label class="form-check-label" for="showArchivedPurchases"
                       th:text="#{ui.show_archived_test_purchases.t1a2}">Show archived test purchases</label>
            </div>
        </div>
        <div class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label small mb-0" for="filter-status" th:text="#{ui.status.ec53}">Status</label>
                <select id="filter-status" name="status" class="form-select form-select-sm">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option th:each="s : ${statuses}" th:value="${s.name}" th:text="${s.displayName}"
                            th:selected="${filter.status == s}"></option>
                </select>
            </div>
            <div class="col-md-3" sec:authorize="hasAnyRole('ADMIN','ACCOUNT_MANAGER','SALES_MANAGER')">
                <label class="form-label small mb-0" for="filter-customer" th:text="#{ui.customer.ce26}">Customer</label>
                <select id="filter-customer" name="customerId" class="form-select form-select-sm">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option th:each="c : ${filterCustomers}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${filter.customerId != null and filter.customerId == c.id}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-0" for="filter-from" th:text="#{list.filter.dateFrom}">From</label>
                <input type="date" id="filter-from" name="createdFrom" class="form-control form-control-sm"
                       th:value="${filter.createdFrom}"/>
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-0" for="filter-to" th:text="#{list.filter.dateTo}">To</label>
                <input type="date" id="filter-to" name="createdTo" class="form-control form-control-sm"
                       th:value="${filter.createdTo}"/>
            </div>
            <div class="col-md-3" th:if="${canFilterMysteryShopper}">
                <label class="form-label small mb-0" for="filter-ms" th:text="#{list.filter.mysteryShopper}">Mystery Shopper</label>
                <select id="filter-ms" name="mysteryShopperId" class="form-select form-select-sm">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option th:each="ms : ${mysteryShoppers}" th:value="${ms.id}" th:text="${ms.username}"
                            th:selected="${filter.mysteryShopperId != null and filter.mysteryShopperId == ms.id}"></option>
                </select>
            </div>
            <div class="col-md-auto d-flex gap-2">
                <button type="submit" class="btn btn-sm btn-primary" th:text="#{list.filter.apply}">Apply</button>
                <a th:href="@{/testpurchases}" class="btn btn-sm btn-outline-secondary" th:text="#{list.filter.reset}">Reset</a>
            </div>
        </div>
    </form>

    <div th:if="${exportLimitExceeded}" class="alert alert-warning" role="alert"
         th:text="${exportLimitMessage}"></div>

    <div th:replace="~{fragments/server-list-pagination :: serverPagination(${purchasePage}, '/testpurchases')}"></div>

    <div class="mb-3 d-flex flex-wrap gap-2">
        <a class="btn btn-success btn-sm"
           th:href="@{/testpurchases/export.csv(status=${filter.status}, customerId=${filter.customerId}, createdFrom=${filter.createdFrom}, createdTo=${filter.createdTo}, mysteryShopperId=${filter.mysteryShopperId}, showArchived=${filter.showArchived}, sort=${listSort})}"
           th:text="#{list.export.csv}">Export CSV</a>
        <a class="btn btn-secondary btn-sm"
           th:href="@{/testpurchases/export.xlsx(status=${filter.status}, customerId=${filter.customerId}, createdFrom=${filter.createdFrom}, createdTo=${filter.createdTo}, mysteryShopperId=${filter.mysteryShopperId}, showArchived=${filter.showArchived}, sort=${listSort})}"
           th:text="#{list.export.excel}">Export Excel</a>
    </div>

    <table id="tpTable" class="table table-hover">
        <thead>
        <tr>
            <th>#</th>
            <th th:text="#{ui.customer.ce26}">Customer</th>
            <th th:text="#{ui.shop.9f82}">Shop</th>
            <th th:text="#{ui.country.5971}">Country</th>
            <th th:text="#{ui.category.3adb}">Category</th>
            <th th:text="#{ui.type.a1fa}">Type</th>
            <th th:text="#{ui.total_price.f354}">Total Price</th>
            <th th:text="#{ui.status.ec53}">Status</th>
            <th th:text="#{ui.created_on.1b60}">Created On</th>
            <th sec:authorize="hasRole('ADMIN')" th:text="#{ui.updated_by.eb4d}">Updated By</th>
            <th th:text="#{ui.actions.06df}">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p : ${purchases}">
            <td th:text="${p.number}"></td>
            <td th:text="${p.customer.name}"></td>
            <td th:text="${p.shop.name}"></td>
            <td th:text="${p.country.getDisplayName()}"></td>
            <td th:text="${p.category.getDisplayName()}"></td>
            <td th:text="${p.type.getDisplayName()}"></td>
            <td th:text="${p.productPrice}"></td>
            <td th:text="${p.status.getDisplayName()}"></td>
            <td th:text="${#temporals.format(p.createdDate, 'yyyy-MM-dd HH:mm')}"></td>
            <td sec:authorize="hasRole('ADMIN')" th:text="${p.updatedByUser}"></td>
            <td>
                <div class="d-flex gap-2">
                    <a th:href="@{'/testpurchases/view/' + ${p.id}}" class="btn btn-sm btn-info">
                        <i class="fas fa-eye me-1"></i><th:block th:text="#{ui.view.4351}">View</th:block>
                    </a>
                    <a th:if="${!p.archived}"
                       th:href="@{'/testpurchases/edit/' + ${p.id}}" class="btn btn-sm btn-warning"
                       sec:authorize="hasAnyRole('ADMIN','ACCOUNT_MANAGER')">
                        <i class="fas fa-edit me-1"></i><th:block th:text="#{ui.edit.7dce}">Edit</th:block>
                    </a>

                    <form th:if="${#authorization.expression('hasRole(''ADMIN'')') and !p.archived}"
                          th:action="@{'/testpurchases/archive/' + ${p.id}}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="btn btn-sm btn-outline-danger" type="submit"
                                th:attr="data-confirm=#{ui.confirm_archive_test_purchase.t3b4}"
                                onclick="return confirm(this.dataset.confirm);">
                            <i class="fas fa-archive me-1"></i><th:block th:text="#{ui.archive_test_purchase.t5c6}">Archive</th:block>
                        </button>
                    </form>

                    <form th:if="${#authorization.expression('hasRole(''ADMIN'')') and p.archived}"
                          th:action="@{'/testpurchases/unarchive/' + ${p.id}}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="btn btn-sm btn-outline-success" type="submit" th:text="#{ui.unarchive_test_purchase.t7d8}">Unarchive</button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(purchases)}">
            <td colspan="11" class="text-muted text-center" th:text="#{list.empty}">No records found.</td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/server-list-pagination :: serverPagination(${purchasePage}, '/testpurchases')}"></div>

</main>
</body>
</html>
