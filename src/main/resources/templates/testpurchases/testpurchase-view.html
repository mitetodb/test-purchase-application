<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{ui.test_purchase_details.a710}">Test Purchase Details</title>
</head>
<body>
<main>
    <h2 th:text="#{ui.test_purchase_details.a710}">Test Purchase Details</h2>

    <div class="mb-3" th:if="${purchase.archived}">
        <div class="alert alert-secondary" th:text="#{ui.archived_test_purchase_read_only.t9e0}">This test purchase is archived and read-only.</div>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.number.2a39}">Number:</label> <span th:text="${purchase.number}"></span>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.customer.5eea}">Customer:</label> <span th:text="${purchase.customer.name}"></span>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.shop.b91c}">Shop:</label> <span th:text="${purchase.shop.name}"></span>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.country.f64b}">Country:</label> <span th:text="${purchase.country.getDisplayName()}"></span>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.category.56a8}">Category:</label> <span th:text="${purchase.category.getDisplayName()}"></span>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.type.e659}">Type:</label> <span th:text="${purchase.type.getDisplayName()}"></span>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.status.24a2}">Status:</label> <span th:text="${purchase.status.getDisplayName()}"></span>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.total_price.614d}">Total Price:</label> <span th:text="${purchase.productPrice}"></span>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.service_fee.eb23}">Service Fee:</label> <span th:text="${purchase.serviceFee}"></span>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.postage_fee.518c}">Postage Fee:</label> <span th:text="${purchase.postageFee}"></span>
    </div>

    <h5 th:text="#{ui.items.9dea}">Items</h5>
    <table class="table">
        <thead>
        <tr>
            <th th:text="#{ui.url.e6b3}">URL</th>
            <th th:text="#{ui.product.deb1}">Product</th>
            <th th:text="#{ui.qty.03ab}">Qty</th>
            <th th:text="#{ui.unit_price.1971}">Unit Price</th>
            <th th:text="#{ui.subtotal.2194}">Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${purchase.items}">
            <td>
                <a th:if="${i.productUrl}"
                   th:href="${i.productUrl}"
                   target="_blank"
                   rel="noopener noreferrer"
                   th:text="${#strings.length(i.productUrl) <= 40 ? i.productUrl : #strings.substring(i.productUrl, 0, 40) + '...'}"
                   title="Open product page" th:title="#{ui.open_product_page.7c7e}">
                </a>
            </td>
            <td th:text="${i.productName}"></td>
            <td th:text="${i.quantity}"></td>
            <td th:text="${i.unitPrice}"></td>
            <td th:text="${i.quantity * i.unitPrice}"></td>
        </tr>
        </tbody>
    </table>

    <h3 class="mt-4" th:text="#{ui.visit_appointment.v24a}">Shop visit appointment</h3>

    <div th:if="${appointmentError}" class="alert alert-danger" th:text="${appointmentError}"></div>

    <div th:if="${purchase.visitAppointmentAt != null}" class="mb-3">
        <div class="mb-2">
            <label th:text="#{ui.visit_scheduled_at.v24b}">Scheduled visit:</label>
            <strong th:text="${#temporals.format(purchase.visitAppointmentAt, 'dd MMM yyyy HH:mm')}"></strong>
            <span th:if="${purchase.visitAppointmentConfirmed}" class="badge bg-success ms-2"
                  th:text="#{ui.visit_confirmed.v24c}">Confirmed</span>
            <span th:if="${!purchase.visitAppointmentConfirmed}" class="badge bg-warning text-dark ms-2"
                  th:text="#{ui.visit_proposed.v24d}">Proposed</span>
        </div>
        <div class="mb-2" th:if="${purchase.visitAppointmentLocation}">
            <label th:text="#{ui.visit_location.v24e}">Location:</label>
            <span th:text="${purchase.visitAppointmentLocation}"></span>
        </div>
        <div class="mb-2" th:if="${purchase.visitAppointmentNotes}">
            <label th:text="#{ui.visit_notes.v24f}">Notes:</label>
            <span th:text="${purchase.visitAppointmentNotes}"></span>
        </div>
    </div>
    <p th:if="${purchase.visitAppointmentAt == null}" class="text-muted" th:text="#{ui.no_visit_scheduled.v24g}">
        No shop visit scheduled yet.
    </p>

    <div th:if="${!purchase.archived and canManageVisitAppointment}" class="card card-body mb-4">
        <form th:action="@{'/testpurchases/' + ${purchase.id} + '/visit-appointment'}" method="post">
            <div class="mb-2">
                <label class="form-label" for="visit-scheduled-at" th:text="#{ui.visit_date_time.v24h}">Visit date &amp; time</label>
                <input id="visit-scheduled-at" class="form-control" type="datetime-local" name="scheduledAt" required
                       th:value="${purchase.visitAppointmentAt != null ? #temporals.format(purchase.visitAppointmentAt, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
            </div>
            <div class="mb-2">
                <label class="form-label" for="visit-location" th:text="#{ui.visit_location.v24e}">Location</label>
                <input id="visit-location" class="form-control" type="text" name="location" maxlength="500"
                       th:placeholder="#{ui.visit_location_placeholder.v24i}"
                       th:value="${purchase.visitAppointmentLocation}"/>
            </div>
            <div class="mb-2">
                <label class="form-label" for="visit-notes" th:text="#{ui.visit_notes.v24f}">Notes</label>
                <textarea id="visit-notes" class="form-control" name="notes" rows="2" maxlength="2000"
                          th:text="${purchase.visitAppointmentNotes}"></textarea>
            </div>
            <div class="form-check mb-2" sec:authorize="hasRole('MYSTERY_SHOPPER')">
                <input class="form-check-input" type="checkbox" name="confirm" value="true" id="visit-confirm"/>
                <label class="form-check-label" for="visit-confirm" th:text="#{ui.confirm_visit_proposal.v24j}">
                    Confirm this visit time (otherwise save as proposed)
                </label>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-primary" th:text="#{ui.save_visit_appointment.v24k}">Save visit appointment</button>
        </form>
        <form th:if="${purchase.visitAppointmentAt != null and !purchase.visitAppointmentConfirmed}"
              th:action="@{'/testpurchases/' + ${purchase.id} + '/visit-appointment/confirm'}"
              method="post" class="mt-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-success" th:text="#{ui.confirm_visit.v24l}">Confirm visit</button>
        </form>
    </div>

    <h5 th:text="#{ui.attachments.7e27}">Attachments</h5>

    <div th:if="${!purchase.archived}">
        <div th:if="${uploadError}" class="alert alert-danger" th:text="${uploadError}"></div>
        <div id="attachment-upload-client-error" class="alert alert-danger d-none" role="alert"></div>

        <form id="attachment-upload-form"
              class="js-monitored-upload-form"
              th:action="@{/attachments/upload/{id}(id=${purchase.id},_csrf=${_csrf.token})}"
              method="post"
              enctype="multipart/form-data"
              th:attr="data-max-upload-bytes=${maxUploadFileBytes},
                       data-upload-too-large-msg=#{error.upload.attachment.too_large(${maxUploadSizeDisplay})}">
            <input type="file" name="file" required/>
            <select name="category">
                <option value="" th:text="#{ui.category_optional.b35e}">--Category (optional)--</option>
                <option th:each="c : ${T(app.model.enums.AttachmentCategory).values()}"
                        th:value="${c}"
                        th:text="${c.getDisplayName()}"></option>
            </select>
            <button th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''ACCOUNT_MANAGER'',''MYSTERY_SHOPPER'')')}"
                    class="btn btn-primary" type="submit" th:text="#{ui.upload.9141}">Upload</button>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        </form>
    </div>

    <ul class="list-group mt-3">
        <li class="list-group-item d-flex align-items-center" th:each="att : ${attachments}">
            <div class="me-3">
                <span th:text="${att.category.getDisplayName()}">File</span>

                <img th:if="${att.fileType.name() == 'JPG' || att.fileType.name() == 'PNG'}"
                     th:src="@{'/attachments/' + ${att.id} + '/preview'}"
                     alt="Preview" th:alt="#{ui.preview.31fd}"
                     style="max-height: 80px; border-radius: 5px; border: 1px solid #ccc;">
            </div>

            <div class="ms-auto">
                <a th:href="@{'/attachments/' + ${att.id} + '/download'}"
                   class="btn btn-sm btn-secondary" th:text="#{ui.download.801a}">Download</a>
            </div>
        </li>
    </ul>

    <h3 class="mt-4" th:text="#{ui.status_history.b421}">Status History</h3>

    <div class="timeline">
        <div th:each="h : ${history}" class="timeline-item">
            <div class="timeline-dot"></div>

            <div class="timeline-content">
                <div class="timeline-time"
                     th:text="${#temporals.format(h.changedAt, 'dd MMM yyyy HH:mm')}"></div>

                <div class="timeline-status">
                    <strong th:text="${h.oldStatus.getDisplayName()}"></strong>
                    →
                    <strong th:text="${h.newStatus.getDisplayName()}"></strong>
                </div>

                <div class="timeline-user">
                    <th:block th:text="#{ui.by.8f55}">By:</th:block> <span th:text="${h.changedBy}"></span>
                </div>

                <div class="timeline-comment" th:if="${h.comment}">
                    <em th:text="${h.comment}"></em>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${!purchase.archived and #authorization.expression('hasAnyRole(''ADMIN'',''ACCOUNT_MANAGER'',''MYSTERY_SHOPPER'')')}">
        <form th:action="@{'/testpurchases/' + ${purchase.id} + '/change-status'}" method="post">
            <select name="newStatus" class="form-select mb-2">
                <option th:each="st : ${statuses}"
                        th:value="${st}"
                        th:text="${st.getDisplayName()}">
                </option>
            </select>
            <input type="text" name="comment" class="form-control mb-2" placeholder="Optional comment" th:placeholder="#{ui.optional_comment.b3ff}">
            <button class="btn btn-primary" th:text="#{ui.change_status.af55}">Change status</button>
        </form>
    </div>

    <div th:if="${!purchase.archived and #authorization.expression('hasAnyRole(''ADMIN'',''ACCOUNT_MANAGER'')')}" class="mt-4">
        <h5>Assign Mystery Shopper</h5>
        <form th:action="@{'/testpurchases/' + ${purchase.id} + '/assign-mystery-shopper'}" method="post">
            <select name="mysteryShopperId" class="form-select mb-2">
                <option value="">-- Unassign --</option>
                <option th:each="ms : ${mysteryShoppers}"
                        th:value="${ms.id}"
                        th:text="${ms.username + ' (' + ms.email + ')'}"
                        th:selected="${purchase.mysteryShopper != null && purchase.mysteryShopper.id == ms.id}">
                </option>
            </select>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-primary">Assign</button>
        </form>
    </div>

    <form th:if="${#authorization.expression('hasRole(''ADMIN'')') and purchase.archived}"
          th:action="@{'/testpurchases/unarchive/' + ${purchase.id}}"
          method="post" class="mt-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="btn btn-outline-success" type="submit" th:text="#{ui.unarchive_test_purchase.t7d8}">Unarchive</button>
    </form>

    <div class="mt-3 d-flex flex-wrap gap-2">
        <a th:href="@{/testpurchases/view/{id}/report.pdf(id=${purchase.id})}"
           class="btn btn-outline-primary"
           th:text="#{testpurchase.export.pdf}">Download PDF report</a>
        <a th:href="@{/testpurchases}" class="btn btn-secondary" th:text="#{ui.back.0557}">Back</a>
    </div>
</main>
</body>
</html>
