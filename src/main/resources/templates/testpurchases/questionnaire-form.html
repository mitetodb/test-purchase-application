<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{ui.questionnaire_form.a17f}">Evaluation questionnaire</title>
</head>
<body>
<main>
    <h2 th:text="#{ui.questionnaire_form.a17f}">Evaluation questionnaire</h2>
    <p>
        <span th:text="#{ui.test_purchase.8b2c}">Test purchase</span>:
        <strong th:text="${questionnaire.testPurchaseNumber}"></strong>
    </p>

    <div th:if="${questionnaireError}" class="alert alert-danger" th:text="${questionnaireError}"></div>

    <form th:action="@{'/testpurchases/' + ${questionnaire.testPurchaseId} + '/questionnaire'}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="card mb-3" th:each="q : ${questionnaire.questions}">
            <div class="card-body">
                <label class="form-label fw-semibold" th:text="${q.prompt}">Question</label>
                <div class="text-muted small mb-2">
                    <span th:text="#{ui.max_score.c4e1}">Max score</span>:
                    <span th:text="${q.maxScore}"></span>
                    ·
                    <span th:text="#{ui.weight.d8a2}">Weight</span>:
                    <span th:text="${q.weight}"></span>
                </div>
                <input class="form-control"
                       type="number"
                       min="0"
                       th:max="${q.maxScore}"
                       th:name="${'score_' + q.id}"
                       th:value="${q.givenScore}"
                       required/>
            </div>
        </div>

        <button class="btn btn-primary" type="submit" th:text="#{ui.submit_questionnaire.e3b9}">Submit evaluation</button>
        <a th:href="@{'/testpurchases/view/' + ${questionnaire.testPurchaseId}}" class="btn btn-secondary ms-2"
           th:text="#{ui.cancel.7a8b}">Cancel</a>
    </form>
</main>
</body>
</html>
