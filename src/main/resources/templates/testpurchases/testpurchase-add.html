<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{ui.create_test_purchase.c4dd}">Create Test Purchase</title>
</head>
<body>
<main>
    <h2 th:text="#{ui.create_test_purchase.c4dd}">Create Test Purchase</h2>

    <form th:action="@{/testpurchases/add}" th:object="${dto}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="mb-3">
            <label th:text="#{ui.customer.ce26}">Customer</label>
            <label for="customer"></label><select id="customer" name="customer" autocomplete="customer" th:field="*{customerId}" class="form-control">
                <option value="" th:text="#{ui.select_customer.5f2b}">--Select customer--</option>
                <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}">Customer</option>
            </select>
        </div>

        <div class="mb-3">
            <label th:text="#{ui.shop.9f82}">Shop</label>
            <label for="shop"></label><select id="shop" name="shop" autocomplete="shop" th:field="*{shopId}" class="form-control">
                <option value="" th:text="#{ui.select_shop.3fe7}">--Select shop--</option>
                <option th:each="s : ${shops}" th:value="${s.id}" th:text="${s.name}">Shop</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="country" th:text="#{ui.country.5971}">Country</label>
            <select id="country" name="country" autocomplete="country" th:field="*{country}" class="form-control">
                <option value="" th:text="#{ui.select_country.c7a2}">--Select country--</option>
                <option th:each="country : ${T(app.model.enums.Country).values()}"
                        th:value="${country}"
                        th:text="${country.getDisplayName()}">
                    Bulgaria
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label for="category" th:text="#{ui.category.3adb}">Category</label>
            <select id="category" name="category" autocomplete="category" th:field="*{category}" class="form-control">
                <option value="" th:text="#{ui.select_category.1173}">--Select category--</option>
                <option th:each="category : ${T(app.model.enums.TestPurchaseCategory).values()}"
                        th:value="${category}"
                        th:text="${category.getDisplayName()}">
                    M
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label for="type" th:text="#{ui.type.a1fa}">Type</label>
            <select id="type" th:field="*{type}" class="form-control">
                <option th:each="type : ${T(app.model.enums.TestPurchaseType).values()}"
                        th:value="${type}"
                        th:text="${type.getDisplayName()}">
                    Forwarding to client
                </option>
            </select>
        </div>

        <h5 th:text="#{ui.items.9dea}">Items</h5>
        <button type="button" class="btn btn-secondary mb-3" onclick="addItem()" th:text="#{ui.add_item.3c5d}">+ Add Item</button>

        <div id="items-container">
            <div th:each="item, iterStat : *{items}" class="card mb-2 p-2 item-block">
                <div class="row mb-2">
                    <div class="col-md-12">
                        <input th:field="*{items[__${iterStat.index}__].productUrl}"
                               class="form-control"
                               placeholder="Product URL" th:placeholder="#{ui.product_url.b1ba}"
                               required />
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-5">
                        <input th:field="*{items[__${iterStat.index}__].productName}"
                               class="form-control"
                               placeholder="Product name" th:placeholder="#{ui.product_name.df64}"
                               required />
                    </div>
                    <div class="col-md-2">
                        <input type="number"
                               th:field="*{items[__${iterStat.index}__].quantity}"
                               class="form-control"
                               placeholder="Qty" th:placeholder="#{ui.qty.03ab}"
                               min="1"
                               required />
                    </div>
                    <div class="col-md-3">
                        <input type="number" step="0.01"
                               th:field="*{items[__${iterStat.index}__].unitPrice}"
                               class="form-control"
                               placeholder="Unit price" th:placeholder="#{ui.unit_price.6c95}"
                               min="0"
                               required />
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-danger"
                                onclick="removeItem(this)" th:text="#{ui.remove.1063}">Remove</button>
                    </div>
                </div>
            </div>
        </div>


        <button class="btn btn-success mt-3" type="submit" th:text="#{ui.create.686e}">Create</button>
        <button class="btn btn-secondary mt-3"
                type="submit"
                formmethod="post"
                th:formaction="@{/testpurchases/add/calculate-price}" th:text="#{ui.calculate_price.3ac2}">Calculate Price</button>
        <a th:href="@{/testpurchases}" class="btn btn-secondary mt-3" th:text="#{ui.cancel.ea47}">Cancel</a>
    </form>


    <div th:if="${price != null}" class="mt-3">
        <h5 th:text="#{ui.calculated_price.938b}">Calculated Price</h5>
        <p>
            <th:block th:text="#{ui.product_total.d794}">Product total:</th:block>
            <span th:text="${price.productPrice}"></span>
        </p>
        <p>
            <th:block th:text="#{ui.service_fee.bed2}">Service fee:</th:block>
            <span th:text="${price.testPurchaseFee}"></span>
        </p>
        <p>
            <th:block th:text="#{ui.postage_fee.8561}">Postage fee:</th:block>
            <span th:text="${price.postageFee}"></span>
        </p>
    </div>

    <div th:if="${priceError != null}" class="alert alert-warning mt-3">
        <span th:text="${priceError}"></span>
    </div>
</main>
</body>
</html>
