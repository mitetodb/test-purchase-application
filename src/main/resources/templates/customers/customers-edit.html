<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{ui.edit_customer.e5d6}">Edit Customer</title>
</head>
<body>
<main>
<h2 th:text="#{ui.edit_customer.e5d6}">Edit Customer</h2>

<form th:action="@{'/customers/edit/' + ${customerDTO.id}}"
      th:object="${customerDTO}" method="post">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="mb-3">
        <label th:text="#{ui.name.4e14}">Name:</label>
        <input th:field="*{name}" class="form-control"/>
        <div class="text-danger" th:errors="*{name}"></div>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.category.56a8}">Category:</label>
        <input th:field="*{category}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label for="country" th:text="#{ui.country.f64b}">Country:</label>
        <select id="country" class="form-control" th:field="*{country}">
            <option th:each="country : ${T(app.model.enums.Country).values()}" th:value="${country}" th:text="${country.getDisplayName()}">Bulgaria</option>
        </select>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.email.6a1e}">Email:</label>
        <input th:field="*{email}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label th:text="#{ui.service_fee.eb23}">Service Fee:</label>
        <input th:field="*{baseServiceFee}" class="form-control"/>
    </div>

    <button class="btn btn-warning" type="submit" th:text="#{ui.update.0693}">Update</button>
    <a th:href="@{/customers}" class="btn btn-secondary" th:text="#{ui.cancel.ea47}">Cancel</a>

</form>
</main>
</body>
</html>
