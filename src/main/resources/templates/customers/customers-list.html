<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="#{ui.customers.e6d0}">Customers</title>
</head>

<body>
<main>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="#{ui.customers.e6d0}">Customers</h2>
        <a th:href="@{/customers/add}" class="btn btn-primary mb-3" th:text="#{ui.add_customer.daaa}">Add Customer</a>
    </div>

    <form class="card card-body mb-3" method="get" th:action="@{/customers}">
        <input type="hidden" name="size" th:value="${customerPage.size}"/>
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label class="form-label small mb-0" for="filter-name" th:text="#{ui.name.49ee}">Name</label>
                <input type="text" id="filter-name" name="name" class="form-control form-control-sm"
                       th:value="${filter.name}" th:placeholder="#{ui.search_name.7c48}"/>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-0" for="filter-country" th:text="#{ui.country.5971}">Country</label>
                <select id="filter-country" name="country" class="form-select form-select-sm">
                    <option value="" th:text="#{list.filter.all}">All</option>
                    <option th:each="co : ${countries}" th:value="${co.name}" th:text="${co.displayName}"
                            th:selected="${filter.country == co}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-0" for="filter-category" th:text="#{ui.category.3adb}">Category</label>
                <input type="text" id="filter-category" name="category" class="form-control form-control-sm"
                       th:value="${filter.category}" th:placeholder="#{ui.search_category.4218}"/>
            </div>
            <div class="col-md-auto d-flex gap-2">
                <button type="submit" class="btn btn-sm btn-primary" th:text="#{list.filter.apply}">Apply</button>
                <a th:href="@{/customers}" class="btn btn-sm btn-outline-secondary" th:text="#{list.filter.reset}">Reset</a>
            </div>
        </div>
    </form>

    <div th:if="${exportLimitExceeded}" class="alert alert-warning" role="alert"
         th:text="${exportLimitMessage}"></div>

    <div th:replace="~{fragments/server-list-pagination :: serverPagination(${customerPage}, '/customers')}"></div>

    <div class="mb-3 d-flex flex-wrap gap-2">
        <a class="btn btn-success btn-sm"
           th:href="@{/customers/export.csv(name=${filter.name}, country=${filter.country}, category=${filter.category})}"
           th:text="#{list.export.csv}">Export CSV</a>
        <a class="btn btn-secondary btn-sm"
           th:href="@{/customers/export.xlsx(name=${filter.name}, country=${filter.country}, category=${filter.category})}"
           th:text="#{list.export.excel}">Export Excel</a>
    </div>

    <table id="customersTable" class="table table-striped">
        <thead>
        <tr>
            <th>#</th>
            <th th:text="#{ui.name.49ee}">Name</th>
            <th th:text="#{ui.category.3adb}">Category</th>
            <th th:text="#{ui.country.5971}">Country</th>
            <th th:text="#{ui.email.ce8a}">Email</th>
            <th th:text="#{ui.service_fee.a90d}">Service Fee</th>
            <th sec:authorize="hasRole('ADMIN')" th:text="#{ui.updated_by.eb4d}">Updated By</th>
            <th th:text="#{ui.actions.06df}">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="c : ${customers}">
            <td th:text="${c.number}"></td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.category}"></td>
            <td th:text="${c.country}"></td>
            <td th:text="${c.email}"></td>
            <td th:text="${c.baseServiceFee}"></td>
            <td sec:authorize="hasRole('ADMIN')" th:text="${c.updatedByUser}"></td>
            <td>
                <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''ACCOUNT_MANAGER'',''SALES_MANAGER'')')}"
                   th:href="@{'/customers/edit/' + ${c.id}}" class="btn btn-warning btn-sm" th:text="#{ui.edit.7dce}">Edit</a>

                <form th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                      th:action="@{'/customers/delete/' + ${c.id}}"
                      method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-danger btn-sm" type="submit" th:text="#{ui.delete.f2a6}">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(customers)}">
            <td colspan="8" class="text-muted text-center" th:text="#{list.empty}">No records found.</td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/server-list-pagination :: serverPagination(${customerPage}, '/customers')}"></div>

</main>
</body>
</html>
