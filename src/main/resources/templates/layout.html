<!DOCTYPE html>
<html th:fragment="layout(title, main)"
      th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/testkauf/testkauf-icon.svg}">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" th:content="#{meta.description}"/>
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" th:content="#{meta.og.site_name}"/>
    <meta property="og:title" th:content="#{meta.og.title}"/>
    <meta property="og:description" th:content="#{meta.og.description}"/>
    <meta property="og:locale"
          th:content="${#locale.language + '_' + (#locale.language == 'en' ? 'US' : (#locale.language == 'de' ? 'DE' : 'BG'))}"/>
    <meta property="og:url" th:content="${pageCanonicalUrl}"/>
    <link rel="preload" th:href="@{/fonts/inter-latin-wght-normal.woff2}" as="font" type="font/woff2" crossorigin="anonymous">
    <th:block th:replace="${title}" th:text="#{ui.test_purchase_application.61e8}">Test Purchase Application</th:block>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Public design tokens + typography -->
    <link rel="stylesheet" th:href="@{/css/testkauf.css}"/>

    <!-- Bootstrap (grid/components; themed via internal-app.css) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Internal app styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/internal-app.css}" />

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
</head>
<body class="app-shell">
<a class="skip" href="#mainpart">Skip to content</a>

<header class="internal-top">
    <th:block th:insert="~{fragments/navbar :: app-navbar}"></th:block>
</header>

<main class="app-main fade-in" id="mainpart">
    <th:block th:replace="${main}"></th:block>
</main>

<th:block th:insert="~{fragments/footer :: app-footer}"></th:block>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/js/table-toolkit.js"></script>
<script th:src="@{/js/upload-form-validation.js}"></script>
</body>
</html>
