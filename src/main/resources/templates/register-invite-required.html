<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{ui.invite_required_title.8f2a}">Invite required</title>
</head>
<body>
<main>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header text-center">
                <div class="mb-3">
                    <i class="fas fa-envelope-open-text" style="font-size: 3rem; color: var(--primary-color);"></i>
                </div>
                <h2 th:text="#{ui.invite_required_title.8f2a}">Invite required</h2>
                <p class="text-muted mb-0" th:text="#{ui.invite_required_message.4c1b}">
                    Registration is invite-only. Use the link from your administrator to create an account.
                </p>
            </div>
            <div class="text-center mt-4">
                <a th:href="@{/login}" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt me-2"></i><th:block th:text="#{ui.sign_in_here.9c03}">Sign in here</th:block>
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
