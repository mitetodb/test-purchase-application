<!DOCTYPE html>
<html lang="en"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{ui.error_403.6e5c}">Error 403</title>
</head>
<body>
<main>
    <h2 th:text="#{ui.you_do_not_have_permission.76ba}">You do not have permission.</h2>
    <p th:text="${message}">403 access denied.</p>
    <p th:if="${errorId}">
        <th:block th:text="#{ui.error_id.fbf0}">Error ID:</th:block> <strong th:text="${errorId}"></strong>
    </p>
    <a th:href="@{/}" class="btn btn-primary mt-3" th:text="#{ui.back_to_home.6110}">Back to home</a>
</main>
</body>
</html>
