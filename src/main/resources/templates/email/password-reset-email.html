<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{ui.password_reset.ba96}">Password Reset</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="font-family: Arial, sans-serif; background-color: #f7f7f7; padding: 20px;">

<div style="max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 6px;">

    <h2 th:text="#{ui.password_reset_request.1eeb}">Password Reset Request</h2>

    <p><th:block th:text="#{ui.hello.8b1a}">Hello</th:block> <strong th:text="${username}"></strong>,</p>

    <p th:text="#{ui.you_requested_to_reset_your_password_cli.4f6a}">You requested to reset your password. Click the button below to set a new one:</p>

    <p style="text-align: center;">
        <a th:href="${resetLink}"
           style="background-color:#007BFF; color:white; padding:10px 18px; text-decoration:none; border-radius:4px;" th:text="#{ui.reset_password.6072}">
            Reset Password
        </a>
    </p>

    <p th:text="#{ui.if_the_button_doesn_t_work_copy_and_past.7d50}">If the button doesn't work, copy and paste this link into your browser:</p>

    <p>
        <a th:href="${resetLink}" th:text="${resetLink}"></a>
    </p>

    <hr/>

    <p style="font-size: 0.9em; color: #555;" th:text="#{ui.this_is_an_automated_message_from_the_te.c71c}">
        This is an automated message from the Test Purchase System.
    </p>

</div>

</body>
</html>
