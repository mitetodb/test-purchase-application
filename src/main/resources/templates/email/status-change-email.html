<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{ui.status_update.20ce}">Status Update</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="font-family: Arial, sans-serif; background-color: #f7f7f7; padding: 20px;">

<div style="max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 6px;">

    <h2><th:block th:text="#{ui.status_update_for_test_purchase.65cd}">Status Update for Test Purchase</th:block> <span th:text="${tpNumber}"></span></h2>

    <p>
        <th:block th:text="#{ui.the_status_has_changed_from.69ab}">The status has changed from</th:block>
        <strong th:text="${oldStatus}"></strong> <th:block th:text="#{ui.to.01b6}">to</th:block>
        <strong th:text="${newStatus}"></strong>.
    </p>

    <p th:if="${comment}">
        <em th:text="#{ui.comment.240f}">Comment:</em> <span th:text="${comment}"></span>
    </p>

    <p>
        <th:block th:text="#{ui.changed_by.fb66}">Changed by:</th:block> <strong th:text="${username}"></strong>
    </p>

    <hr/>

    <p style="font-size: 0.9em; color: #555;" th:text="#{ui.this_is_an_automated_message_from_the_te.c71c}">
        This is an automated message from the Test Purchase System.
    </p>

</div>

</body>
</html>
