spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.flyway.enabled=false
spring.liquibase.enabled=false
app.init-data.enabled=false
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true

app.security.login.max-failed-attempts=3
app.security.login.lockout-duration-minutes=60
app.security.login.rate-limit.max-attempts=5
app.security.login.rate-limit.window-seconds=3600

app.security.password.min-length=12
app.security.totp.encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.security.totp.issuer=Test Purchase App
app.security.two-factor.max-session-failed-attempts=5
