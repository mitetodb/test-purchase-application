# nginx vhost for testkauf.getinweb.de
#
# OPTION A - existing nginx on the HOST owns 80/443 (recommended):
#   sudo cp deploy/nginx/testkauf.getinweb.de.conf /etc/nginx/sites-available/
#   sudo ln -s ../sites-available/testkauf.getinweb.de.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d testkauf.getinweb.de      # or certbot certonly --webroot -w /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#   upstream = 127.0.0.1:${APP_HOST_PORT} (default 8090) published by deploy/docker-compose.prod.yml
#
# OPTION B - the existing proxy runs IN DOCKER (nginx/Traefik/Caddy container):
#   attach the app to that proxy's network (see "proxy" in docker-compose.prod.yml),
#   drop this file into the proxy's conf.d and change the upstream to  server app:8080;
#   (Traefik/Caddy: route Host(`testkauf.getinweb.de`) -> http://app:8080 instead.)
#
# !! SHARED HOST / IPv6 WARNING !!
#   Do NOT let certbot (or yourself) add "listen [::]:443 ssl ipv6only=on" / "listen [::]:80" here
#   unless EVERY other site on this nginx also listens on IPv6. Reason: if another site
#   (e.g. book.getinweb.de) has an AAAA record but only "listen 443", the first [::]:443 listener
#   becomes the IPv6 default server for ALL names -> IPv6 visitors of the other site get THIS
#   certificate (name mismatch / TLS error). This happened on the first deploy. After running
#   certbot --nginx, check:  grep -n "listen \[::\]" this-file   and delete those lines.
#
# Do NOT start a second proxy binding 80/443 - the other stack already uses them.

upstream testkauf_app {
    server 127.0.0.1:8090;   # Option B: server testkauf-app-1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name testkauf.getinweb.de;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name testkauf.getinweb.de;

    ssl_certificate     /etc/letsencrypt/live/testkauf.getinweb.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testkauf.getinweb.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:testkauf_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;   # app allows 10MB uploads

    # Internal-only endpoints are not exposed through the proxy
    location ~ ^/actuator/(?!health$) { return 404; }

    location / {
        proxy_pass http://testkauf_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
